name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build WebAssembly
        run: |
          mkdir -p site
          GOOS=js GOARCH=wasm go build -o site/game.wasm ./cmd/game
          cp index.html site/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/ || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
